# lean-lss configuration. Loaded by LssSettings.from_yaml() at startup.
# Universal settings are in lean_core.config.CoreSettings; this file
# adds LSS-specific sections (marker, ocr, ingestion) and overrides
# the universal defaults (top-level fields take precedence over YAML
# under the universal section names).

embedding:
  model: LiquidAI/LFM2.5-Embedding-350M
  model_revision: f35ae2c91d687658dbf1f2b449382f0b019b9808
  dim: 1024
  device: cpu
  remote_url: ""
  remote_model: lfm2.5-embed-32k
  num_ctx: 32768
  http_timeout: 30.0
  max_retries: 3

ocr:
  base_url: ""
  model: baidu/Unlimited-OCR
  dpi: 300
  timeout_s: 1800.0
  max_tokens: 32768
  batch_size: 20

marker:
  force_ocr: false
  remote_url: "http://192.168.2.37:8000"

chunking:
  target_max: 450
  hard_cap: 500
  overlap: 50
  max_heading_level: 4
  token_encoding: cl100k_base

retrieval:
  top_k: 5
  max_k: 100
  max_query_len: 2000
  fetch_k_cap: 500
  min_similarity: 0.0
  hybrid_search: true
  fetch_multiplier: 8
  fetch_k_floor: 40
  rrf_k: 60
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    model_revision: c5ee24cb16019beea0893ab7796b1df96625c6b8
    top_n: 5

eval:
  sample_size: 50
  k: 5
  seed: 42

transport:
  mcp_host: 127.0.0.1
  mcp_port: 8765
  api_port: 8766

storage:
  corpus_root: "data"
  max_pdf_mb: 200

health:
  http_timeout: 10

logging:
  level: INFO

ingestion:
  block_match_min_overlap: 0.15

llm:
  minimax_base_url: https://api.minimax.io
  minimax_model: MiniMax-Text-01
  ollama_url: ""
  ollama_model: qwen3.5:9b
  timeout_s: 60.0
  generate_max_tokens: 500
  generate_temperature: 0.0
  contextual_retrieval: false
  multi_query: false
  hyde: false
  multi_query_count: 4

vlm:
  enabled: false
  base_url: ""
  model: ""
  detail: default
  timeout_s: 120.0
  max_concurrency: 4
  max_tokens: 1000
  disable_thinking: true
