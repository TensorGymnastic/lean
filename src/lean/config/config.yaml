embedding:
  model: LiquidAI/LFM2.5-Embedding-350M
  model_revision: f35ae2c91d687658dbf1f2b449382f0b019b9808  # pinned for trust_remote_code safety
  dim: 1024
  device: cpu
  remote_url: ""          # set to http://<gpu-host>:11434 to use remote Ollama
  remote_model: lfm2.5-embed-32k
  num_ctx: 32768          # must match Ollama model's PARAMETER num_ctx
  http_timeout: 30.0      # Ollama embedding HTTP client timeout (seconds)
  max_retries: 3          # retry attempts on non-200 from Ollama

ocr:
  base_url: ""            # set to http://<gpu-host>:8000 to use Unlimited-OCR
  model: baidu/Unlimited-OCR
  dpi: 300
  timeout_s: 1800.0
  max_tokens: 32768
  batch_size: 20

marker:
  force_ocr: false        # set true to force OCR on all pages (better for scanned PDFs)

chunking:
  target_max: 450
  hard_cap: 500
  overlap: 50             # token overlap between adjacent chunks (prevents context loss at boundaries)
  max_heading_level: 4
  token_encoding: cl100k_base

retrieval:
  top_k: 5
  max_k: 100              # hard ceiling on user-supplied k (DoS prevention)
  max_query_len: 2000     # reject queries longer than this (DoS prevention)
  fetch_k_cap: 500        # hard ceiling on fetch_k regardless of multiplier
  min_similarity: 0.0
  hybrid_search: true
  fetch_multiplier: 8       # fetch_k = max(k * fetch_multiplier, fetch_k_floor) — wider candidate set for reranking
  fetch_k_floor: 40         # minimum fetch_k regardless of multiplier
  rrf_k: 60                 # Reciprocal Rank Fusion constant (standard IR value)
  rerank:
    enabled: true           # cross-encoder reranking (ms-marco-MiniLM-L-6-v2), ~100ms/query on CPU
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    model_revision: c5ee24cb16019beea0893ab7796b1df96625c6b8  # pinned for reproducibility
    top_n: 5

eval:
  sample_size: 50           # number of chunks to sample for eval
  k: 5                      # top-k for hit_rate/MRR/NDCG/Recall
  seed: 42                  # RNG seed for reproducible sampling

transport:
  mcp_host: 127.0.0.1
  mcp_port: 8765
  api_port: 8766

storage:
  corpus_root: "data"          # root directory for ingestible PDFs; paths outside are rejected (security)
  max_pdf_mb: 200              # reject PDFs larger than this (resource exhaustion prevention)

health:
  http_timeout: 10          # timeout for OCR/Ollama health check requests (seconds)

logging:
  level: INFO               # Python logging level (DEBUG/INFO/WARNING/ERROR)

llm:
  minimax_base_url: https://api.minimax.io
  minimax_model: MiniMax-Text-01
  ollama_url: ""              # e.g. http://gpu-host:11434 (alternative to MiniMax)
  ollama_model: qwen3.5:9b
  timeout_s: 60.0
  generate_max_tokens: 500    # default max_tokens for LLM generation calls
  generate_temperature: 0.0   # default temperature for LLM generation calls
  contextual_retrieval: false  # set true to prepend LLM context per chunk at ingestion
  multi_query: false           # set true to generate N paraphrased queries at search time
  hyde: false                  # set true to use HyDE (hypothetical document embeddings)
  multi_query_count: 4

vlm:
  # === ACTIVE: MiniMax M3 via API (fast, clean JSON, ~$0.004/image) ===
  enabled: true
  provider: minimax
  base_url: "https://api.minimax.io/v1"
  model: "MiniMax-M3"
  api_key: ""                            # from .env (VLM_API_KEY)
  detail: high                           # high = best chart resolution
  timeout_s: 120.0
  max_concurrency: 4
  max_tokens: 8192                       # generous output budget (M3 uses all for content, no thinking waste)
  disable_thinking: true                 # M3 properly suppresses reasoning

  # === LOCAL FALLBACK: Qwen3.5-9b on GPU server (free, self-hosted) ===
  # Uncomment to switch. Qwen3.5 is natively multimodal (vision+text).
  # Note: thinks internally (~3K tokens), so needs higher max_tokens + longer timeout.
  #
  # provider: ollama
  # base_url: "http://192.168.2.37:11434/v1"
  # model: "qwen3.5-128k:9b"             # 128K context, Q4_K_M, 9.9 GB on RTX 3080 Ti
  # api_key: ""
  # detail: default
  # timeout_s: 300.0
  # max_tokens: 8192
  # disable_thinking: false              # Ollama ignores this; model thinks regardless
