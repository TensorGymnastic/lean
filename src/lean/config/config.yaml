embedding:
  model: LiquidAI/LFM2.5-Embedding-350M
  dim: 1024
  device: cpu
  remote_url: ""          # set to http://<gpu-host>:11434 to use remote Ollama
  remote_model: lfm2.5-embed-32k

ocr:
  base_url: ""            # set to http://<gpu-host>:8000 to use Unlimited-OCR
  model: baidu/Unlimited-OCR
  dpi: 300
  timeout_s: 1800.0
  max_tokens: 32768
  batch_size: 20

chunking:
  target_min: 350
  target_max: 450
  hard_cap: 500
  max_heading_level: 4
  token_encoding: cl100k_base

retrieval:
  top_k: 5
  min_similarity: 0.0
  hybrid_search: true
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 5

storage:
  sources_bucket: sources
  markdown_bucket: markdown

transport:
  mcp_host: 127.0.0.1
  mcp_port: 8765
  api_port: 8766
