embedding:
  model: LiquidAI/LFM2.5-Embedding-350M
  dim: 1024
  device: cpu
  remote_url: ""          # set to http://<gpu-host>:11434 to use remote Ollama
  remote_model: lfm2.5-embed-32k
  num_ctx: 32768          # must match Ollama model's PARAMETER num_ctx

ocr:
  base_url: ""            # set to http://<gpu-host>:8000 to use Unlimited-OCR
  model: baidu/Unlimited-OCR
  dpi: 300
  timeout_s: 1800.0
  max_tokens: 32768
  batch_size: 20

chunking:
  target_min: 350
  target_max: 450
  hard_cap: 500
  overlap: 50             # token overlap between adjacent chunks (prevents context loss at boundaries)
  max_heading_level: 4
  token_encoding: cl100k_base

retrieval:
  top_k: 5
  min_similarity: 0.0
  hybrid_search: true
  fetch_multiplier: 8       # fetch_k = max(k * fetch_multiplier, 40) — wider candidate set for reranking
  rerank:
    enabled: true           # cross-encoder reranking (ms-marco-MiniLM-L-6-v2), ~100ms/query on CPU
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 5

transport:
  mcp_host: 127.0.0.1
  mcp_port: 8765
  api_port: 8766

llm:
  minimax_base_url: https://api.minimax.io
  minimax_model: MiniMax-Text-01
  ollama_url: ""              # e.g. http://gpu-host:11434 (alternative to MiniMax)
  ollama_model: qwen3.5:9b
  timeout_s: 60.0
  contextual_retrieval: false  # set true to prepend LLM context per chunk at ingestion
  multi_query: false           # set true to generate N paraphrased queries at search time
  hyde: false                  # set true to use HyDE (hypothetical document embeddings)
  multi_query_count: 4
