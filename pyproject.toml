[project]
name = "lean-lss"
version = "0.1.0"
description = "Lean Six Sigma PDF corpus MCP server (built on lean-core)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lean-core",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
local-models = [
    "sentence-transformers>=3.0",
    "transformers>=4.57.1,<5",
    "torch>=2.3",
]
marker = [
    "marker-pdf",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fpdf2>=2.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
lean = "lean_lss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_lss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires local Supabase running",
    "e2e: requires full stack (Supabase + OCR server + real models)",
    "slow: downloads or computes something large",
]

[tool.coverage.run]
source = ["src/lean_lss"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["TC001", "TC002", "TC003", "S603", "S607", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/lean_lss/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src/lean_lss"]

[[tool.mypy.overrides]]
module = ["fitz", "markitdown", "marker.*"]
ignore_missing_imports = true

[tool.uv]
package = true

[tool.uv.sources]
lean-core = { path = "../../lean-core", editable = true }
