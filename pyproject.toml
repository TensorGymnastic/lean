[project]
name = "lean"
version = "0.1.0"
description = "MCP server for Lean Six Sigma PDF corpus — Unlimited-OCR + Liquid LMF embeddings + Supabase pgvector"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "supabase>=2.5",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "transformers>=4.57.1,<5",
    "torch>=2.3",
    "markitdown[pdf]>=0.0.16",
    "mistune>=3.0",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "anyio>=4.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fpdf2>=2.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-psycopg2>=2.9",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
lean = "lean.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires local Supabase running",
    "e2e: requires full stack (Supabase + vLLM + real models)",
    "slow: downloads or computes something large",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["TC001", "TC002", "TC003"]  # TYPE_CHECKING moves are noisy for eager-imported modules

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src/lean"]

[[tool.mypy.overrides]]
module = ["fitz", "markitdown"]
ignore_missing_imports = true

[tool.uv]
package = true
