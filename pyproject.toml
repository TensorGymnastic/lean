[project]
name = "starter-llm-service-fastapi"
version = "0.1.0"
description = "LLM FastAPI service starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12",
  "openai>=1.70.0",
  "pydantic>=2.13.2",
  "pydantic-settings>=2.8.1",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.3",
  "deptry>=0.23.0",
  "factory-boy>=3.3.3",
  "Faker>=37.1.0",
  "freezegun>=1.5.1",
  "hypothesis>=6.131.0",
  "httpx>=0.28.1",
  "mypy>=1.15.0",
  "pip-audit>=2.8.0",
  "pre-commit>=4.3.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "pytest-randomly>=3.16.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.11.4",
  "vulture>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --randomly-seed=last"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.vulture]
paths = ["app", "tests"]

[tool.bandit]
targets = ["app"]

[tool.deptry]
known_first_party = ["app"]
per_rule_ignores = { DEP002 = ["openai", "pydantic-settings", "uvicorn"] }

[tool.uv]
package = false
