[project]
name = "lean"
version = "0.2.0"
description = "Universal MCP+pgvector corpus server. YAML-driven domains; reusable across PDFs, code, web, and any structured text source."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Quanti" },
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "mistune>=3.0",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "anyio>=4.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
local-models = [
    "sentence-transformers>=3.0",
    "transformers>=4.57.1,<5",
    "torch>=2.3",
]
marker = [
    "marker-pdf",
]
web = [
    "trafilatura>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fpdf2>=2.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
lean = "lean.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean"]
include = ["src/lean/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires local Postgres running",
    "e2e: requires full stack (Postgres + OCR server + real models)",
    "slow: downloads or computes something large",
]

[tool.coverage.run]
source = ["src/lean"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["TC001", "TC002", "TC003", "S603", "S607", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/lean/core/store/search.py" = ["S608"]
"src/lean/core/eval/runner.py" = ["S311"]
"src/lean/core/transports/cli.py" = ["B008"]
"src/lean/core/transports/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src/lean"]

[[tool.mypy.overrides]]
module = ["fitz", "markitdown", "marker.*", "PIL.*", "sentence_transformers.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.uv]
package = true
